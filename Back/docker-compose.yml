version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: dsw-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dsw
      MYSQL_USER: dsw
      MYSQL_PASSWORD: dsw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
